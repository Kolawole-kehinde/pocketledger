
services:
  postgres:
    image: postgres:16-alpine
    container_name: pocketledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pocketledger_db
      POSTGRES_USER: pocketledger_user
      POSTGRES_PASSWORD: pocketledger_dev_password
    ports:
      - "5454:5432"
    volumes:
      - pocketledger_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.1.1
    container_name: pocketledger_kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - pocketledger_kafka_data:/var/lib/kafka/data

volumes:
  pocketledger_data:
  pocketledger_kafka_data:
